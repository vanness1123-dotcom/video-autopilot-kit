# Base configuration for the AI travel-reel layer.
vision:
  provider: local
  model: qwen3-vl:4b-instruct
  endpoint: http://localhost:11434
  timeout_seconds: 120
  retries: 1
  longest_edge: 768
  jpeg_quality: 88
  cache_dir_name: .travel_reel_cache/vision

scoring:
  technical_quality: 0.15
  composition: 0.15
  travel_relevance: 0.20
  story_value: 0.20
  uniqueness: 0.10
  emotion: 0.10
  vertical_suitability: 0.10

events:
  semantic_similarity_threshold: 0.19
  filename_sequence_gap: 12
  time_gap_seconds: 14400
  strong_semantic_threshold: 0.30

selection:
  primary_target: 20
  alternate_target: 10
  min_video_target: 4
  max_video_target: 8
  selfie_soft_ratio: 0.25
  people_soft_ratio: 0.40
  category_soft_ratio: 0.30
  duplicate_time_seconds: 180
  duplicate_similarity: 0.72
  duplicate_similarity_without_time: 0.53
  minimum_video_score: 45

story:
  style: cinematic-travel
  min_story_items: 4
  max_story_items: 20
  highlight_target: 3
  max_alternates: 2
  chronology_min_ratio: 0.70

planner:
  target_duration_seconds: 40.0
  aspect_ratio: "9:16"
  duration_tolerance_seconds: 0.01
  min_shots: 15
  max_shots: 24
  photo_min_duration: 1.0
  photo_default_duration: 1.8
  photo_max_duration: 2.5
  video_min_duration: 1.5
  video_default_duration: 3.0
  video_max_duration: 4.0
  hook_bias_seconds: 0.5
  highlight_bias_seconds: 0.5
  closing_bias_seconds: 0.4
  default_transition: cut
  default_framing: center

renderer:
  width: 1080
  height: 1920
  fps: 30
  video_codec: libx264
  pixel_format: yuv420p
  preset: medium
  crf: 20
  audio_codec: aac
  audio_bitrate: 192k
  output_filename: reel.mp4
  temp_directory_name: .travel_reel_render
  keep_temp: false
  photo_motion: none
  background_mode: black
  ffmpeg_loglevel: error
